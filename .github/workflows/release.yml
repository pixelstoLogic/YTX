name: Build YTX release installer

on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Prepare Windows installer resources
        run: npm run prepare:installer
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Attach installer to published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release upload $env:RELEASE_TAG "dist/YTX-Setup-$version.exe" --clobber
