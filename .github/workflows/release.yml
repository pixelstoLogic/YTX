name: Build and publish YTX release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run installer
      - name: Create GitHub release and upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release create $tag "dist/YTX-Setup-$version.exe" --target main --title "YTX Studio $version" --notes-file CHANGELOG.md

